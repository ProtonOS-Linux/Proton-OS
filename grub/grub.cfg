set timeout=5
set default=2

insmod efi_gop
insmod efi_uga
insmod all_video
insmod gfxterm
insmod png
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

search --no-floppy --set=root --label OA_LIVE

if loadfont /boot/grub/font.pf2; then
    set gfxmode=auto
    terminal_output gfxterm
fi

background_image /boot/grub/splash.png

# ==========================================
# COLORI MENU PRINCIPALE
# ==========================================
set menu_color_normal=white/black
set menu_color_highlight=white/blue

# ==========================================
# COLORI EDITOR E TERMINALE
# ==========================================
set color_normal=white/black
set color_highlight=white/blue

menuentry "--- Proton OS ---" {
    true
}
menuentry "" {
    true
}
menuentry "Start Proton OS" {
    linux /live/vmlinuz boot=live components cow_spacesize=2G audit=0 splash quiet loglevel=3 systemd.show_status=auto udev.log_priority=3
    initrd /live/initrd.xz
}
menuentry "Start Proton OS - RAM mode" {
    linux /live/vmlinuz boot=live components cow_spacesize=2G audit=0 splash quiet loglevel=3 systemd.show_status=auto udev.log_priority=3 toram
    initrd /live/initrd.xz
}
